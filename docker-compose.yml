services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chatty
      POSTGRES_PASSWORD: chatty
      POSTGRES_DB: chatty
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatty"]
      interval: 5s
      timeout: 5s
      retries: 5

  # A real SMTP server that never delivers anywhere, plus a web inbox to read
  # what it caught — http://localhost:8025.
  #
  # Worth a container rather than leaving development on MAIL_TRANSPORT=console:
  # the console transport proves the outbox ran, and nothing else. It cannot show
  # that the connection string parses, that the sender is accepted, that the
  # Message-ID is well formed, or that the link survives whatever the transport
  # does to the body. Those are the things that break, and this is the cheapest
  # place to see them break.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Optional in development: leave REDIS_URL unset and the server keeps its
  # rate-limit counters and socket rooms in memory, which is correct for one
  # instance. Start this and set REDIS_URL to exercise the multi-instance path.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
