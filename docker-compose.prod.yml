# Zero-monthly-bill production stack: two API instances behind one internal
# gateway, with Postgres, Redis and uploads on the same host. Run with:
#
#   JWT_SECRET=$(openssl rand -hex 32) docker compose -f docker-compose.prod.yml up --build
#
# Ports bind to loopback only. For a public deployment, add
# docker-compose.tunnel.yml; Cloudflare terminates TLS and reaches these
# services over an outbound-only tunnel, so the host opens no inbound port.

# Its own project name, and this line is not cosmetic. Compose derives the
# project from the directory otherwise, so this file and docker-compose.yml
# would both own a container called `chatty-postgres-1` — starting one would
# quietly replace the other's, pointed at a different volume, and `down` on
# either would take out both.
name: chatty-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: chatty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatty}
      POSTGRES_DB: chatty
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatty"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-1: &api
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://chatty:${POSTGRES_PASSWORD:-chatty}@postgres:5432/chatty
      # Always set here, unlike development: without it each instance would keep
      # its own rate-limit counters and its own socket rooms, and the two below
      # would silently behave as two separate systems.
      REDIS_URL: redis://redis:6379
      # No default. An unset JWT_SECRET fails env validation at boot, which is
      # the correct outcome — a hard-coded fallback is a signing key published
      # in a git repository.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. JWT_SECRET=$(openssl rand -hex 32)}
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      NODE_ENV: production
      # Mail, with no defaults, for the same reason JWT_SECRET has none: the
      # fallback would be worse than the failure. `MAIL_TRANSPORT=console` is
      # refused outright under NODE_ENV=production — it would write every
      # password reset link to the container log — so these three are what make
      # this file bootable at all.
      MAIL_TRANSPORT: smtp
      SMTP_URL: ${SMTP_URL:?set SMTP_URL, e.g. smtp://user:pass@smtp.provider.example:587}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM to an address on a domain you have verified with the provider}
      # Operational data is private too. Prometheus can scrape each API over
      # this Docker network; callers without this bearer token get a 401.
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN to at least 32 random characters}
    volumes:
      # Shared between both instances on purpose: an avatar uploaded through
      # api-1 has to be servable by api-2. This is the local stand-in for the
      # object storage that would do the job in a real deployment.
      - uploads:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Same image, same everything. Its only job is to make single-instance
  # assumptions fail loudly during local testing instead of in production.
  api-2:
    <<: *api

  api-gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # The tunnel joins this Docker network directly in production. Keeping a
      # loopback port still lets the smoke test exercise the gateway on-host
      # without making the API reachable from the public network.
      - "127.0.0.1:4000:4000"
    depends_on:
      api-1: { condition: service_healthy }
      api-2: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    # The same value again, and it has to be: the build arg above is compiled
    # into the bundle, while this one is read at container start to render the
    # Content-Security-Policy. One `API_PUBLIC_URL` still drives both, so there is
    # nothing here to keep in sync by hand — see apps/web/Dockerfile.
    environment:
      API_ORIGIN: ${API_PUBLIC_URL:-http://localhost:4000}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api-gateway: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  uploads:
